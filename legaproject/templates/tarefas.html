{% extends 'base.html' %}

{% block title %}Minhas Tarefas - Mentor{% endblock %}

{% block extra_css %}
<style>
    .tasks-wrapper {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        flex: 1;
        padding: 40px 20px;
        min-height: calc(100vh - 180px);
    }

    .container {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 30px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 900px;
        margin: 20px;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(56, 189, 248, 0.3);
        padding-bottom: 15px;
        margin-bottom: 25px;
    }

    .header h2 {
        margin: 0;
        color: #38bdf8;
        font-size: 1.8rem;
        letter-spacing: -0.025em;
    }

    .btn-back {
        text-decoration: none;
        color: #94a3b8;
        font-weight: 600;
        font-size: 0.85rem;
        padding: 8px 16px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 8px;
        transition: all 0.2s;
    }

    .btn-back:hover {
        background: rgba(148, 163, 184, 0.1);
        color: #f8fafc;
        border-color: #94a3b8;
    }

    /* Módulos e Tarefas */
    .module-card {
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(56, 189, 248, 0.2);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 25px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    
    .module-header {
        color: #38bdf8;
        font-size: 1.25rem;
        font-weight: bold;
        border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        padding-bottom: 10px;
        margin-bottom: 15px;
    }

    .task-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .task-item {
        display: flex;
        align-items: flex-start;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 8px;
        padding: 15px;
        transition: all 0.3s;
    }
    
    .task-item:hover {
        border-color: rgba(56, 189, 248, 0.4);
        background: rgba(15, 23, 42, 0.8);
    }

    .task-content {
        flex: 1;
        width: 100%;
    }

    .task-title {
        font-weight: 600;
        color: #f8fafc;
        margin-bottom: 5px;
        font-size: 1.15rem;
        transition: all 0.3s;
    }

    .task-description {
        font-size: 0.95rem;
        color: #94a3b8;
        line-height: 1.5;
        margin-bottom: 15px;
        transition: all 0.3s;
    }

    .task-meta {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    .badge {
        font-size: 0.75rem;
        padding: 5px 10px;
        border-radius: 12px;
        font-weight: bold;
    }

    .badge-time {
        background: rgba(148, 163, 184, 0.2);
        color: #cbd5e1;
    }

    .badge-diff-1 { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .badge-diff-2 { background: rgba(132, 204, 22, 0.2); color: #a3e635; }
    .badge-diff-3 { background: rgba(234, 179, 8, 0.2); color: #facc15; }
    .badge-diff-4 { background: rgba(249, 115, 22, 0.2); color: #fb923c; }
    .badge-diff-5 { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .task-completed .task-title,
    .task-completed .task-description {
        text-decoration: line-through;
        opacity: 0.6;
    }
    
    .task-completed {
        border-color: rgba(34, 197, 94, 0.4);
        background: rgba(15, 23, 42, 0.4);
    }

    /* Área de Q&A integrada na tarefa */
    .task-qa-area {
        background: rgba(15, 23, 42, 0.7);
        border-top: 1px dashed rgba(56, 189, 248, 0.3);
        padding-top: 20px;
        margin-top: 10px;
    }

    .qa-question {
        font-size: 1rem;
        color: #38bdf8;
        margin-bottom: 15px;
        font-weight: 600;
        line-height: 1.4;
    }

    .qa-options {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 15px;
    }

    .qa-option-label {
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 8px;
        padding: 10px 15px;
        display: flex;
        align-items: center;
        cursor: pointer;
        transition: all 0.2s;
        color: #e2e8f0;
        font-size: 0.9rem;
    }

    .qa-option-label:hover {
        border-color: #38bdf8;
        background: rgba(30, 41, 59, 0.8);
    }
    
    .qa-option-input {
        margin-right: 12px;
        accent-color: #38bdf8;
    }

    .btn-responder {
        background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
        box-shadow: 0 4px 10px 0 rgba(56, 189, 248, 0.2);
        width: auto;
        align-self: flex-start;
    }
    
    .btn-responder:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(56, 189, 248, 0.4);
    }
    
    .btn-responder:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .completed-badge {
        color: #4ade80;
        font-weight: 600;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 15px;
        border-top: 1px dashed rgba(34, 197, 94, 0.3);
        padding-top: 15px;
    }

    .loading-indicator {
        text-align: center;
        color: #38bdf8;
        font-size: 1rem;
        font-style: italic;
        margin-top: 20px;
        padding: 20px;
    }
    
    .empty-state {
        text-align: center;
        color: #94a3b8;
        padding: 40px 20px;
        font-size: 1.1rem;
    }


</style>
{% endblock %}

{% block content %}
<div class="tasks-wrapper">
    <div class="container">
        <div class="header">
            <h2>Minhas Tarefas</h2>
            <a href="/" class="btn-back">← Voltar</a>
        </div>

        <div id="loadingIndicator" class="loading-indicator">
            Buscando suas tarefas... Aguarde.
        </div>

        <div id="resultArea" style="display: none;">
            <!-- Os módulos renderizados virão aqui -->
        </div>
    </div>
</div>


{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', async function () {
        const accessToken = localStorage.getItem('access_token');
        if (!accessToken) {
            window.location.href = '/login/';
            return;
        }

        const loadingIndicator = document.getElementById('loadingIndicator');
        const resultArea = document.getElementById('resultArea');

        // Enviar a resposta via botão na própria tarefa
        resultArea.addEventListener('click', async function(event) {
            if (event.target.classList.contains('btn-responder')) {
                const btn = event.target;
                const taskId = btn.getAttribute('data-task-id');
                const taskItem = btn.closest('.task-item');
                
                // Encontra a opção selecionada dentro do qa-area específico dessa tarefa
                const qaArea = document.getElementById(`qa-area-${taskId}`);
                const selectedOption = qaArea.querySelector(`input[name="taskOption_${taskId}"]:checked`);
                
                if (!selectedOption) {
                    alert('Por favor, selecione uma resposta antes de confirmar!');
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Verificando...';

                try {
                    const response = await fetch(`/api/tarefas/${taskId}/responder/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${accessToken}`,
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify({ resposta: selectedOption.value })
                    });

                    const data = await response.json();
                    
                    if (response.status === 200) {
                        if (data.sucesso) {
                            // Marca tarefa como concluída
                            taskItem.classList.add('task-completed');
                            
                            // Remove o formulário de perguntas e mostra mensagem de sucesso
                            qaArea.innerHTML = `<div class="completed-badge">✓ Tarefa concluída com sucesso!</div>`;
                        } else {
                            alert('❌ ' + data.detail);
                            btn.disabled = false;
                            btn.textContent = 'Responder';
                        }
                    } else {
                        alert('Falha ao enviar resposta.');
                        btn.disabled = false;
                        btn.textContent = 'Responder';
                    }
                } catch (error) {
                    console.error(error);
                    alert('Erro de conexão ao tentar responder.');
                    btn.disabled = false;
                    btn.textContent = 'Responder';
                }
            }
        });

        // Função de busca
        try {
            const response = await fetch('/api/tarefas/', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${accessToken}`
                }
            });

            loadingIndicator.style.display = 'none';

            if (response.status === 200) {
                const modulos = await response.json();
                
                if (!modulos || modulos.length === 0) {
                    resultArea.innerHTML = '<div class="empty-state">Nenhuma tarefa encontrada. Crie seu primeiro Roadmap na página inicial!</div>';
                } else {
                    renderModules(modulos);
                }
                
                resultArea.style.display = 'block';
                
            } else if (response.status === 401 || response.status === 403) {
                alert('Sua sessão expirou. Faça login novamente.');
                localStorage.clear();
                window.location.href = '/login/';
            } else {
                resultArea.innerHTML = '<div class="empty-state">Ocorreu um erro ao buscar as tarefas.</div>';
                resultArea.style.display = 'block';
            }
        } catch (error) {
            console.error('Erro ao buscar tarefas:', error);
            loadingIndicator.style.display = 'none';
            resultArea.innerHTML = '<div class="empty-state">Erro de conexão com o servidor.</div>';
            resultArea.style.display = 'block';
        }

        // Função de renderização DOM
        function renderModules(modulos) {
            resultArea.innerHTML = ''; 

            modulos.forEach((modulo) => {
                const moduleCard = document.createElement('div');
                moduleCard.className = 'module-card';

                const moduleHeader = document.createElement('div');
                moduleHeader.className = 'module-header';
                moduleHeader.textContent = modulo.nome_modulo;
                moduleCard.appendChild(moduleHeader);

                const taskList = document.createElement('div');
                taskList.className = 'task-list';

                if (modulo.tarefas && modulo.tarefas.length > 0) {
                    modulo.tarefas.forEach((tarefa) => {
                        const taskItem = document.createElement('div');
                        taskItem.className = 'task-item';
                        if (tarefa.concluido) {
                            taskItem.classList.add('task-completed');
                        }

                        // Task content wrapper
                        const taskContent = document.createElement('div');
                        taskContent.className = 'task-content';

                        const taskTitle = document.createElement('div');
                        taskTitle.className = 'task-title';
                        taskTitle.textContent = tarefa.titulo;

                        const taskDesc = document.createElement('div');
                        taskDesc.className = 'task-description';
                        taskDesc.textContent = tarefa.conteudo_exercicio || '';

                        const taskMeta = document.createElement('div');
                        taskMeta.className = 'task-meta';

                        const timeBadge = document.createElement('span');
                        timeBadge.className = 'badge badge-time';
                        timeBadge.textContent = `⏱️ ${tarefa.tempo_estimado} min`;
                        taskMeta.appendChild(timeBadge);

                        const diffBadge = document.createElement('span');
                        const pontos = Math.min(Math.max(tarefa.pontos_dificuldade, 1), 5);
                        diffBadge.className = `badge badge-diff-${pontos}`;
                        diffBadge.textContent = `Dificuldade: ${pontos}/5`;
                        taskMeta.appendChild(diffBadge);

                        taskContent.appendChild(taskTitle);
                        if (tarefa.conteudo_exercicio) taskContent.appendChild(taskDesc);
                        taskContent.appendChild(taskMeta);

                        // Cria a área de Q&A se houver pergunta
                        const qaArea = document.createElement('div');
                        qaArea.className = 'task-qa-area';
                        qaArea.id = `qa-area-${tarefa.id}`;

                        if (tarefa.concluido) {
                            qaArea.innerHTML = `<div class="completed-badge">✓ Tarefa concluída com sucesso!</div>`;
                        } else if (tarefa.pergunta && tarefa.opcoes && tarefa.opcoes.length > 0) {
                            // Pergunta
                            const questionDiv = document.createElement('div');
                            questionDiv.className = 'qa-question';
                            questionDiv.textContent = tarefa.pergunta;
                            
                            // Opções
                            const optionsDiv = document.createElement('div');
                            optionsDiv.className = 'qa-options';
                            
                            tarefa.opcoes.forEach((opcao, idx) => {
                                const lbl = document.createElement('label');
                                lbl.className = 'qa-option-label';
                                
                                const inp = document.createElement('input');
                                inp.type = 'radio';
                                inp.name = `taskOption_${tarefa.id}`;
                                inp.value = opcao;
                                inp.className = 'qa-option-input';
                                
                                lbl.appendChild(inp);
                                lbl.appendChild(document.createTextNode(opcao));
                                optionsDiv.appendChild(lbl);
                            });

                            // Botão
                            const btnSubmit = document.createElement('button');
                            btnSubmit.className = 'btn-responder';
                            btnSubmit.setAttribute('data-task-id', tarefa.id);
                            btnSubmit.textContent = 'Responder';

                            qaArea.appendChild(questionDiv);
                            qaArea.appendChild(optionsDiv);
                            qaArea.appendChild(btnSubmit);
                        } else {
                            qaArea.style.display = 'none';
                        }
                        
                        taskContent.appendChild(qaArea);
                        taskItem.appendChild(taskContent);
                        taskList.appendChild(taskItem);
                    });
                } else {
                    taskList.innerHTML = '<p style="color: #94a3b8; font-size: 0.9rem;">Nenhuma tarefa cadastrada neste módulo.</p>';
                }

                moduleCard.appendChild(taskList);
                resultArea.appendChild(moduleCard);
            });
        }
    });
</script>
{% endblock %}
