<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LEGA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        .container {
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            margin: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #007BFF;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .error-message {
            color: #dc3545;
            margin-top: 15px;
            text-align: center;
            font-size: 0.9em;
            background-color: #f8d7da;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }

        .footer-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9em;
            color: #666;
        }

        .footer-link a {
            color: #007BFF;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Entrar</h2>
        <form id="loginForm">
            <!-- Token de segurança do Django (CSRF) -->
            {% csrf_token %}

            <div class="form-group">
                <label for="usuario">Usuário ou E-mail</label>
                <input type="text" id="usuario" name="usuario" required placeholder="Digite seu apelido ou e-mail">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required placeholder="Digite sua senha">
            </div>

            <button type="submit" class="btn">Entrar</button>
            <div id="errorMessage" class="error-message"></div>
        </form>

        <div class="footer-link">
            Não tem uma conta? <a href="/cadastro/">Cadastre-se</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            // Evita o comportamento padrão do POST do HTML
            event.preventDefault();

            const form = event.target;
            const errorMessageDiv = document.getElementById('errorMessage');
            errorMessageDiv.style.display = 'none'; // Esconde a box antes de tentar
            errorMessageDiv.innerHTML = ''; // Limpa mensagens anteriores

            // Extraindo o CSRF Token
            const csrfToken = form.querySelector('[name=csrfmiddlewaretoken]').value;

            // O TokenObtainPairView do SimpleJWT espera os campos configurados no USERNAME_FIELD da Model.
            // O nosso USERNAME_FIELD na model é 'usuario' e o campo da senha no python é 'password'.
            const data = {
                usuario: form.usuario.value,
                password: form.password.value
            };

            try {
                // Fetch para a API oficial de Login
                const response = await fetch("/api/auth/login", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify(data)
                });

                if (response.status === 200) {
                    // Login bem-sucedido: Captura os tokens JWT
                    const responseData = await response.json();

                    // Salva os tokens no localStorage para uso em rotas protegidas (ex: /api/usuarios/perfil)
                    localStorage.setItem('access_token', responseData.access);
                    localStorage.setItem('refresh_token', responseData.refresh);

                    // Redireciona para o perfil/dashboard
                    window.location.href = '/perfil/';
                } else if (response.status === 401) {
                    // Erro de credenciais inválidas (Padrão do DRF SimpleJWT)
                    errorMessageDiv.innerHTML = "<strong>Erro:</strong> Usuário ou senha incorretos.";
                    errorMessageDiv.style.display = 'block';
                } else {
                    // Tratamento de outros Erros de Validação da API
                    const errorData = await response.json();
                    let errorMessages = [];
                    for (const key in errorData) {
                        if (errorData.hasOwnProperty(key)) {
                            errorMessages.push(`<strong>${key}:</strong> ${errorData[key]}`);
                        }
                    }
                    errorMessageDiv.innerHTML = errorMessages.length > 0 ? errorMessages.join('<br>') : "Usuário ou senha incorretos.";
                    errorMessageDiv.style.display = 'block'; // Mostra a div de erro
                }
            } catch (error) {
                console.error("Erro na requisição:", error);
                errorMessageDiv.innerHTML = "Ocorreu um erro inesperado ao conectar com o servidor. Verifique sua conexão e tente novamente.";
                errorMessageDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
