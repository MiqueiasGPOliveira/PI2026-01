{% extends 'base.html' %}

{% block title %}Minhas Tarefas - Mentor{% endblock %}

{% block extra_css %}
<style>
    .tasks-wrapper {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        flex: 1;
        padding: 40px 20px;
        min-height: calc(100vh - 180px);
    }

    .container {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 30px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 900px;
        margin: 20px;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(56, 189, 248, 0.3);
        padding-bottom: 15px;
        margin-bottom: 25px;
    }

    .header h2 {
        margin: 0;
        color: #38bdf8;
        font-size: 1.8rem;
        letter-spacing: -0.025em;
    }

    .btn-back {
        text-decoration: none;
        color: #94a3b8;
        font-weight: 600;
        font-size: 0.85rem;
        padding: 8px 16px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 8px;
        transition: all 0.2s;
    }

    .btn-back:hover {
        background: rgba(148, 163, 184, 0.1);
        color: #f8fafc;
        border-color: #94a3b8;
    }

    /* Módulos e Tarefas */
    .module-card {
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(56, 189, 248, 0.2);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 25px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    
    .module-header {
        color: #38bdf8;
        font-size: 1.25rem;
        font-weight: bold;
        border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        padding-bottom: 10px;
        margin-bottom: 15px;
    }

    .task-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .task-item {
        display: flex;
        align-items: flex-start;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 8px;
        padding: 15px;
        transition: all 0.3s;
    }
    
    .task-item:hover {
        border-color: rgba(56, 189, 248, 0.4);
        background: rgba(15, 23, 42, 0.8);
    }

    .task-content {
        flex: 1;
        width: 100%;
    }

    .task-header-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 5px;
    }

    .task-title {
        font-weight: 600;
        color: #f8fafc;
        font-size: 1.15rem;
        transition: all 0.3s;
    }

    .task-description {
        font-size: 0.95rem;
        color: #94a3b8;
        line-height: 1.5;
        margin-bottom: 15px;
        transition: all 0.3s;
    }

    .task-meta {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    .badge {
        font-size: 0.75rem;
        padding: 5px 10px;
        border-radius: 12px;
        font-weight: bold;
    }

    .status-badge {
        font-size: 0.75rem;
        padding: 4px 24px 4px 10px;
        border-radius: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        white-space: nowrap;
        margin-left: 10px;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        outline: none;
        cursor: pointer;
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23cbd5e1%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat;
        background-position: right 8px top 50%;
        background-size: 8px auto;
    }
    
    select.status-badge option {
        background: #1e293b;
        color: #f8fafc;
    }

    .status-concluido {
        background: rgba(34, 197, 94, 0.2);
        color: #4ade80;
        border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-emandamento {
        background: rgba(56, 189, 248, 0.2);
        color: #38bdf8;
        border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .status-pendente {
        background: rgba(148, 163, 184, 0.2);
        color: #cbd5e1;
        border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .badge-time {
        background: rgba(148, 163, 184, 0.2);
        color: #cbd5e1;
    }

    .badge-diff-1 { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .badge-diff-2 { background: rgba(132, 204, 22, 0.2); color: #a3e635; }
    .badge-diff-3 { background: rgba(234, 179, 8, 0.2); color: #facc15; }
    .badge-diff-4 { background: rgba(249, 115, 22, 0.2); color: #fb923c; }
    .badge-diff-5 { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .task-completed .task-title,
    .task-completed .task-description {
        text-decoration: line-through;
        opacity: 0.6;
    }
    
    .task-completed {
        border-color: rgba(34, 197, 94, 0.4);
        background: rgba(15, 23, 42, 0.4);
    }

    /* Área de Q&A integrada na tarefa */
    .task-qa-area {
        background: rgba(15, 23, 42, 0.7);
        border-top: 1px dashed rgba(56, 189, 248, 0.3);
        padding-top: 20px;
        margin-top: 10px;
    }

    .qa-question {
        font-size: 1rem;
        color: #38bdf8;
        margin-bottom: 15px;
        font-weight: 600;
        line-height: 1.4;
    }

    .qa-options {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 15px;
    }

    .qa-option-label {
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 8px;
        padding: 10px 15px;
        display: flex;
        align-items: center;
        cursor: pointer;
        transition: all 0.2s;
        color: #e2e8f0;
        font-size: 0.9rem;
    }

    .qa-option-label:hover {
        border-color: #38bdf8;
        background: rgba(30, 41, 59, 0.8);
    }
    
    .qa-option-input {
        margin-right: 12px;
        accent-color: #38bdf8;
    }

    .btn-responder {
        background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
        box-shadow: 0 4px 10px 0 rgba(56, 189, 248, 0.2);
        width: auto;
        align-self: flex-start;
    }
    
    .btn-responder:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(56, 189, 248, 0.4);
    }
    
    .btn-responder:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .completed-badge {
        color: #4ade80;
        font-weight: 600;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 15px;
        border-top: 1px dashed rgba(34, 197, 94, 0.3);
        padding-top: 15px;
    }

    .loading-indicator {
        text-align: center;
        color: #38bdf8;
        font-size: 1rem;
        font-style: italic;
        margin-top: 20px;
        padding: 20px;
    }
    
    .empty-state {
        text-align: center;
        color: #94a3b8;
        padding: 40px 20px;
        font-size: 1.1rem;
    }


</style>
{% endblock %}

{% block content %}
<div class="tasks-wrapper">
    <div class="container">
        <div class="header">
            <h2>Minhas Tarefas</h2>
            <a href="/trilhas/" class="btn-back">← Voltar</a>
        </div>

        <div id="loadingIndicator" class="loading-indicator">
            Buscando suas tarefas... Aguarde.
        </div>

        <div id="resultArea" style="display: none;">
            <!-- Os módulos renderizados virão aqui -->
        </div>
    </div>
</div>


{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', async function () {
        const accessToken = localStorage.getItem('access_token');
        if (!accessToken) {
            window.location.href = '/login/';
            return;
        }

        const loadingIndicator = document.getElementById('loadingIndicator');
        const resultArea = document.getElementById('resultArea');

        // Enviar a resposta via botão na própria tarefa
        resultArea.addEventListener('click', async function(event) {
            if (event.target.classList.contains('btn-responder')) {
                const btn = event.target;
                const taskId = btn.getAttribute('data-task-id');
                const taskItem = btn.closest('.task-item');
                
                // Encontra a opção selecionada dentro do qa-area específico dessa tarefa
                const qaArea = document.getElementById(`qa-area-${taskId}`);
                const selectedOption = qaArea.querySelector(`input[name="taskOption_${taskId}"]:checked`);
                
                if (!selectedOption) {
                    await showModalAlert('Por favor, selecione uma resposta antes de confirmar!');
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Verificando...';

                try {
                    const response = await fetch(`/api/tarefas/${taskId}/responder/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${accessToken}`,
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify({ resposta: selectedOption.value })
                    });

                    const data = await response.json();
                    
                    if (response.status === 200) {
                        if (data.sucesso) {
                            // Marca tarefa como concluída
                            taskItem.classList.add('task-completed');
                            
                            // Atualiza o status badge
                            const statusBadge = taskItem.querySelector('.status-badge');
                            if (statusBadge) {
                                statusBadge.value = 'concluido';
                                statusBadge.className = 'status-badge status-concluido';
                            }
                            
                            const badgeDiv = document.getElementById(`qa-badge-${taskId}`);
                            const formDiv = document.getElementById(`qa-form-${taskId}`);
                            if (badgeDiv) badgeDiv.style.display = 'flex';
                            if (formDiv) formDiv.style.display = 'none';
                        } else {
                            await showModalAlert('❌ ' + data.detail, 'Erro');
                            btn.disabled = false;
                            btn.textContent = 'Responder';
                        }
                    } else {
                        await showModalAlert('Falha ao enviar resposta.', 'Erro');
                        btn.disabled = false;
                        btn.textContent = 'Responder';
                    }
                } catch (error) {
                    console.error(error);
                    await showModalAlert('Erro de conexão ao tentar responder.', 'Erro de Conexão');
                    btn.disabled = false;
                    btn.textContent = 'Responder';
                }
            }
        });

        // Função de busca
        const urlParams = new URLSearchParams(window.location.search);
        const roadmapId = urlParams.get('roadmap_id');
        let fetchUrl = '/api/tarefas/';
        if (roadmapId) {
            fetchUrl += `?roadmap_id=${roadmapId}`;
        }
        
        try {
            const response = await fetch(fetchUrl, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${accessToken}`
                }
            });

            loadingIndicator.style.display = 'none';

            if (response.status === 200) {
                const modulos = await response.json();
                
                if (!modulos || modulos.length === 0) {
                    resultArea.innerHTML = '<div class="empty-state">Nenhuma tarefa encontrada para esta trilha. Crie uma nova trilha na página de Trilhas!</div>';
                } else {
                    renderModules(modulos);
                }
                
                resultArea.style.display = 'block';
                
            } else if (response.status === 401 || response.status === 403) {
                await showModalAlert('Sua sessão expirou. Faça login novamente.', 'Sessão Expirada');
                localStorage.clear();
                window.location.href = '/login/';
            } else {
                resultArea.innerHTML = '<div class="empty-state">Ocorreu um erro ao buscar as tarefas.</div>';
                resultArea.style.display = 'block';
            }
        } catch (error) {
            console.error('Erro ao buscar tarefas:', error);
            loadingIndicator.style.display = 'none';
            resultArea.innerHTML = '<div class="empty-state">Erro de conexão com o servidor.</div>';
            resultArea.style.display = 'block';
        }

        // Função de renderização DOM
        function renderModules(modulos) {
            resultArea.innerHTML = ''; 
            let foundEmAndamento = false;

            modulos.forEach((modulo) => {
                const moduleCard = document.createElement('div');
                moduleCard.className = 'module-card';

                const moduleHeader = document.createElement('div');
                moduleHeader.className = 'module-header';
                moduleHeader.textContent = modulo.nome_modulo;
                moduleCard.appendChild(moduleHeader);

                const taskList = document.createElement('div');
                taskList.className = 'task-list';

                if (modulo.tarefas && modulo.tarefas.length > 0) {
                    modulo.tarefas.forEach((tarefa) => {
                        const taskItem = document.createElement('div');
                        taskItem.className = 'task-item';
                        if (tarefa.concluido) {
                            taskItem.classList.add('task-completed');
                        }

                        // Task content wrapper
                        const taskContent = document.createElement('div');
                        taskContent.className = 'task-content';

                        const taskHeaderRow = document.createElement('div');
                        taskHeaderRow.className = 'task-header-row';

                        const taskTitle = document.createElement('div');
                        taskTitle.className = 'task-title';
                        taskTitle.textContent = tarefa.titulo;

                        const statusSelect = document.createElement('select');
                        statusSelect.className = 'status-badge';
                        statusSelect.setAttribute('data-task-id', tarefa.id);
                        
                        const options = [
                            { value: 'pendente', text: 'PENDENTE' },
                            { value: 'em_andamento', text: 'EM ANDAMENTO' },
                            { value: 'concluido', text: 'CONCLUÍDO' }
                        ];
                        
                        let currentStatus = tarefa.status || 'pendente';
                        if (!tarefa.status || tarefa.status === 'pendente') {
                            if (tarefa.concluido) {
                                currentStatus = 'concluido';
                            } else if (!foundEmAndamento) {
                                currentStatus = 'em_andamento';
                                foundEmAndamento = true;
                            }
                        }

                        options.forEach(opt => {
                            const optionEl = document.createElement('option');
                            optionEl.value = opt.value;
                            optionEl.textContent = opt.text;
                            if (opt.value === currentStatus) {
                                optionEl.selected = true;
                            }
                            statusSelect.appendChild(optionEl);
                        });

                        function updateSelectColor(selectEl) {
                            selectEl.className = 'status-badge';
                            if (selectEl.value === 'concluido') {
                                selectEl.classList.add('status-concluido');
                            } else if (selectEl.value === 'em_andamento') {
                                selectEl.classList.add('status-emandamento');
                            } else {
                                selectEl.classList.add('status-pendente');
                            }
                        }
                        updateSelectColor(statusSelect);

                        statusSelect.addEventListener('change', async function() {
                            const newStatus = this.value;
                            updateSelectColor(this);
                            
                            try {
                                const response = await fetch(`/api/tarefas/${tarefa.id}/status/`, {
                                    method: 'PATCH',
                                    headers: {
                                        'Content-Type': 'application/json',
                                        'Authorization': `Bearer ${accessToken}`,
                                        'X-CSRFToken': '{{ csrf_token }}'
                                    },
                                    body: JSON.stringify({ status: newStatus })
                                });
                                
                                const data = await response.json();
                                if (response.status === 200) {
                                    const badgeDiv = document.getElementById(`qa-badge-${tarefa.id}`);
                                    const formDiv = document.getElementById(`qa-form-${tarefa.id}`);

                                    if (newStatus === 'concluido') {
                                        taskItem.classList.add('task-completed');
                                        if (badgeDiv) badgeDiv.style.display = 'flex';
                                        if (formDiv) formDiv.style.display = 'none';
                                    } else {
                                        taskItem.classList.remove('task-completed');
                                        if (badgeDiv) badgeDiv.style.display = 'none';
                                        if (formDiv && formDiv.children.length > 0) {
                                            formDiv.style.display = 'block';
                                            const qaArea = document.getElementById(`qa-area-${tarefa.id}`);
                                            if (qaArea) qaArea.style.display = 'block';
                                        }
                                    }
                                } else {
                                    await showModalAlert('Falha ao atualizar status: ' + (data.detail || ''), 'Erro');
                                }
                            } catch (err) {
                                console.error(err);
                                await showModalAlert('Erro de conexão ao atualizar status.', 'Erro de Conexão');
                            }
                        });

                        taskHeaderRow.appendChild(taskTitle);
                        taskHeaderRow.appendChild(statusSelect);

                        const taskDesc = document.createElement('div');
                        taskDesc.className = 'task-description';
                        taskDesc.textContent = tarefa.conteudo_exercicio || '';

                        const taskMeta = document.createElement('div');
                        taskMeta.className = 'task-meta';

                        const timeBadge = document.createElement('span');
                        timeBadge.className = 'badge badge-time';
                        timeBadge.textContent = `⏱️ ${tarefa.tempo_estimado} min`;
                        taskMeta.appendChild(timeBadge);

                        const diffBadge = document.createElement('span');
                        const pontos = Math.min(Math.max(tarefa.pontos_dificuldade, 1), 5);
                        diffBadge.className = `badge badge-diff-${pontos}`;
                        diffBadge.textContent = `Dificuldade: ${pontos}/5`;
                        taskMeta.appendChild(diffBadge);

                        taskContent.appendChild(taskHeaderRow);
                        if (tarefa.conteudo_exercicio) taskContent.appendChild(taskDesc);
                        taskContent.appendChild(taskMeta);

                        // Cria a área de Q&A se houver pergunta
                        const qaArea = document.createElement('div');
                        qaArea.className = 'task-qa-area';
                        qaArea.id = `qa-area-${tarefa.id}`;

                        const badgeDiv = document.createElement('div');
                        badgeDiv.className = 'completed-badge';
                        badgeDiv.innerHTML = `✓ Tarefa concluída com sucesso! Atualize a página para ver a próxima tarefa.`;
                        badgeDiv.id = `qa-badge-${tarefa.id}`;

                        const formDiv = document.createElement('div');
                        formDiv.id = `qa-form-${tarefa.id}`;

                        if (tarefa.pergunta && tarefa.opcoes && tarefa.opcoes.length > 0) {
                            // Pergunta
                            const questionDiv = document.createElement('div');
                            questionDiv.className = 'qa-question';
                            questionDiv.textContent = tarefa.pergunta;
                            
                            // Opções
                            const optionsDiv = document.createElement('div');
                            optionsDiv.className = 'qa-options';
                            
                            tarefa.opcoes.forEach((opcao, idx) => {
                                const lbl = document.createElement('label');
                                lbl.className = 'qa-option-label';
                                
                                const inp = document.createElement('input');
                                inp.type = 'radio';
                                inp.name = `taskOption_${tarefa.id}`;
                                inp.value = opcao;
                                inp.className = 'qa-option-input';
                                
                                lbl.appendChild(inp);
                                lbl.appendChild(document.createTextNode(opcao));
                                optionsDiv.appendChild(lbl);
                            });

                            // Botão
                            const btnSubmit = document.createElement('button');
                            btnSubmit.className = 'btn-responder';
                            btnSubmit.setAttribute('data-task-id', tarefa.id);
                            btnSubmit.textContent = 'Responder';

                            formDiv.appendChild(questionDiv);
                            formDiv.appendChild(optionsDiv);
                            formDiv.appendChild(btnSubmit);
                        }

                        qaArea.appendChild(badgeDiv);
                        qaArea.appendChild(formDiv);

                        if (tarefa.concluido) {
                            badgeDiv.style.display = 'flex';
                            formDiv.style.display = 'none';
                        } else if (tarefa.pergunta && tarefa.opcoes && tarefa.opcoes.length > 0) {
                            badgeDiv.style.display = 'none';
                            formDiv.style.display = 'block';
                        } else {
                            qaArea.style.display = 'none';
                        }
                        
                        taskContent.appendChild(qaArea);
                        taskItem.appendChild(taskContent);
                        taskList.appendChild(taskItem);
                    });
                } else {
                    taskList.innerHTML = '<p style="color: #94a3b8; font-size: 0.9rem;">Nenhuma tarefa cadastrada neste módulo.</p>';
                }

                moduleCard.appendChild(taskList);
                resultArea.appendChild(moduleCard);
            });
        }
    });
</script>
{% endblock %}
