<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Mentor</title>
    <style>
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: #f8fafc;
        }

        
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            margin: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #38bdf8; 
            font-size: 1.8rem;
            letter-spacing: -0.025em;
        }

        .profile-info {
            margin-bottom: 25px;
        }

        .info-group {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-group:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #94a3b8; 
            font-size: 0.9rem;
        }

        .info-value {
            color: #e2e8f0;
            font-size: 0.95rem;
            text-align: right;
        }

        .btn-mentor {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 14px 0 rgba(34, 197, 94, 0.3);
            box-sizing: border-box;
        }

        .btn-mentor:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
        }

        .btn-logout {
            width: 100%;
            padding: 10px;
            background: transparent;
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: rgba(248, 113, 113, 0.1);
            border-color: #f87171;
        }

        .loading-message {
            text-align: center;
            color: #38bdf8;
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Meu Perfil</h2>
        
        <div id="loading" class="loading-message">
            Sincronizando dados com o Mentor...
        </div>

        <div id="profileContent" class="profile-info" style="display: none;">
            <div class="info-group">
                <span class="info-label">Nome Completo</span>
                <span class="info-value" id="perfil-nome_completo"></span>
            </div>
            
            <div class="info-group">
                <span class="info-label">Usuário</span>
                <span class="info-value" id="perfil-usuario"></span>
            </div>
            
            <div class="info-group">
                <span class="info-label">E-mail</span>
                <span class="info-value" id="perfil-email"></span>
            </div>
            
            <div class="info-group">
                <span class="info-label">Nascimento</span>
                <span class="info-value" id="perfil-dt_nasc"></span>
            </div>
            
            <div class="info-group">
                <span class="info-label">Telefone</span>
                <span class="info-value" id="perfil-telefone"></span>
            </div>
            
            <div class="info-group">
                <span class="info-label">Instituição</span>
                <span class="info-value" id="perfil-instituicao"></span>
            </div>
            
            <div class="info-group">
                <span class="info-label">Área</span>
                <span class="info-value" id="perfil-area_atuacao"></span>
            </div>
        </div>

        <div style="margin-top: 30px; text-align: center;">
            <a href="{% url 'roadmap_page' %}" class="btn-mentor" style="display: none;" id="btnMentor">Gerar Roadmap de Estudos</a>
        </div>

        <button id="btnLogout" class="btn-logout" style="display: none;">Encerrar Sessão</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const accessToken = localStorage.getItem('access_token');
            
            if (!accessToken) {
                window.location.href = '/login/';
                return;
            }

            try {
                const response = await fetch('/api/usuarios/perfil', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.status === 200) {
                    const data = await response.json();
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('profileContent').style.display = 'block';
                    document.getElementById('btnMentor').style.display = 'block';
                    document.getElementById('btnLogout').style.display = 'block';

                    document.getElementById('perfil-nome_completo').textContent = data.nome_completo;
                    document.getElementById('perfil-usuario').textContent = data.usuario;
                    document.getElementById('perfil-email').textContent = data.email;
                    document.getElementById('perfil-telefone').textContent = data.telefone;
                    
                    let dataNascimento = data.dt_nasc;
                    if (dataNascimento && dataNascimento.includes(' ')) {
                        let dataParte = dataNascimento.split(' ')[0];
                        let [ano, mes, dia] = dataParte.split('-');
                        dataNascimento = `${dia}/${mes}/${ano}`;
                    }
                    document.getElementById('perfil-dt_nasc').textContent = dataNascimento;
                    document.getElementById('perfil-instituicao').textContent = data.instituicao || 'Não informado';
                    document.getElementById('perfil-area_atuacao').textContent = data.area_atuacao || 'Não informado';

                } else {
                    localStorage.removeItem('access_token');
                    window.location.href = '/login/';
                }
            } catch (error) {
                document.getElementById('loading').textContent = 'Erro ao conectar com o servidor.';
            }
        });

        document.getElementById('btnLogout').addEventListener('click', function() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            window.location.href = '/login/';
        });
    </script>
</body>

</html>
