<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Roadmap - Mentor</title>
    
    <!-- Biblioteca Marked.js via CDN para renderizar Markdown de forma segura e limpa -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: #f8fafc;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 800px;
            margin: 20px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        /* Cabeçalho */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(56, 189, 248, 0.3);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            color: #38bdf8;
            font-size: 1.5rem;
            letter-spacing: -0.025em;
        }

        .btn-back {
            text-decoration: none;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 8px 16px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .btn-back:hover {
            background: rgba(148, 163, 184, 0.1);
            color: #f8fafc;
            border-color: #94a3b8;
        }

        /* Formulário e Scroll */
        .form-area {
            overflow-y: auto;
            padding-right: 10px;
            scrollbar-width: thin;
            scrollbar-color: #334155 transparent;
        }

        .form-area::-webkit-scrollbar { width: 6px; }
        .form-area::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .intro-text {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }

        .btn-generate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
            box-shadow: 0 4px 14px 0 rgba(34, 197, 94, 0.3);
        }

        .btn-generate:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
        }

        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }

        .loading-indicator {
            display: none;
            text-align: center;
            color: #38bdf8;
            font-size: 0.9rem;
            font-style: italic;
            margin-top: 20px;
            padding: 15px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 8px;
        }

        .result-area {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            overflow-y: auto;
            max-height: 60vh;
            line-height: 1.6;
            color: #e2e8f0;
        }
        
        .result-area h1, .result-area h2, .result-area h3 {
            color: #38bdf8;
            margin-top: 1.5rem;
            border-bottom: 1px solid rgba(56, 189, 248, 0.1);
            padding-bottom: 8px;
        }
        
        .result-area ul, .result-area ol {
            padding-left: 25px;
        }

        .result-area li {
            margin-bottom: 10px;
        }
        
        .result-area code {
            background-color: #1e293b;
            color: #f472b6;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
        }

        ::placeholder { color: #475569; }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h2>Gerador de Roadmap Educacional</h2>
            <a href="{% url 'perfil_page' %}" class="btn-back">← Voltar</a>
        </div>

        <div class="form-area" id="formArea">
            <p style="color: #22c55e; margin-bottom: 20px;">
                Preencha os detalhes abaixo e nossa Inteligência Artificial criará uma trilha de estudos personalizada unindo suas informações do perfil com seu objetivo atual.
            </p>

            <form id="roadmapForm">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="assunto">O que você quer aprender? (Assunto)</label>
                    <input type="text" id="assunto" required placeholder="Ex: Programação Python, Filosofia, Matemática...">
                </div>

                <div class="form-group">
                    <label for="objetivo">Qual seu objetivo com isso?</label>
                    <input type="text" id="objetivo" required placeholder="Ex: Conseguir o primeiro emprego, Passar no vestibular...">
                </div>

                <div class="form-group">
                    <label for="tempo_pretendido">Qual o prazo pretendido?</label>
                    <input type="text" id="tempo_pretendido" required placeholder="Ex: 6 meses, 1 ano, 3 semanas...">
                </div>

                <div class="form-group">
                    <label for="horas_diarias">Quantas horas por dia pode estudar?</label>
                    <input type="text" id="horas_diarias" required placeholder="Ex: 2 horas, 30 minutos...">
                </div>

                <div class="form-group">
                    <label for="nivel">Seu nível atual no assunto:</label>
                    <select id="nivel" required>
                        <option value="">Selecione...</option>
                        <option value="Iniciante do zero">Iniciante do zero</option>
                        <option value="Básico (Já sei alguma coisa)">Básico</option>
                        <option value="Intermediário">Intermediário</option>
                        <option value="Avançado">Avançado</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="formato">Formato preferido de consumo:</label>
                    <select id="formato" required>
                        <option value="">Selecione...</option>
                        <option value="Videoaulas e Prática">Videoaulas e Prática</option>
                        <option value="Apenas Leitura (Livros e Artigos)">Apenas Leitura</option>
                        <option value="Projetos Práticos (Mão na massa)">Projetos Práticos</option>
                        <option value="Misto (Vídeos, Textos e Exercícios)">Misto</option>
                    </select>
                </div>

                <button type="submit" class="btn-generate" id="btnGenerate">Gerar meu Roadmap</button>
            </form>

            <div class="loading-indicator" id="loadingIndicator">
                Analisando seu perfil e montando a trilha perfeita... Aguarde.
            </div>
        </div>

        <div class="result-area" id="resultArea">
            <!-- O Markdown parseado pelo marked.js vai aparecer aqui -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Verifica a autenticação antes de qualquer coisa
            const accessToken = localStorage.getItem('access_token');
            if (!accessToken) {
                window.location.href = '/login/';
                return;
            }

            const roadmapForm = document.getElementById('roadmapForm');
            const btnGenerate = document.getElementById('btnGenerate');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const resultArea = document.getElementById('resultArea');

            roadmapForm.addEventListener('submit', async function (event) {
                event.preventDefault();

                // 1. Extração dos dados do form
                const payload = {
                    assunto: document.getElementById('assunto').value,
                    objetivo: document.getElementById('objetivo').value,
                    tempo_pretendido: document.getElementById('tempo_pretendido').value,
                    horas_diarias: document.getElementById('horas_diarias').value,
                    nivel: document.getElementById('nivel').value,
                    formato: document.getElementById('formato').value
                };

                // Oculta área de resultado antiga, trava form e mostra loading
                resultArea.style.display = 'none';
                btnGenerate.disabled = true;
                loadingIndicator.style.display = 'block';

                const csrfToken = roadmapForm.querySelector('[name=csrfmiddlewaretoken]').value;

                try {
                    // 2. Dispara o fetch POST para a API
                    // A API no backend se encarregará de buscar os dados sensíveis do usuário na sessão
                    const response = await fetch('/api/mentor/interagir', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrfToken,
                            'Authorization': `Bearer ${accessToken}`
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.status === 200) {
                        const data = await response.json();
                        
                        // 3. Usa a biblioteca 'marked' para renderizar o Markdown em HTML
                        // O backend já configurou o prompt para a IA devolver Markdown limpo
                        resultArea.innerHTML = marked.parse(data.response);
                        
                        // Exibe a área de resultado rolável
                        resultArea.style.display = 'block';
                        
                    } else if (response.status === 401 || response.status === 403) {
                        alert('Sua sessão expirou. Faça login novamente.');
                        localStorage.clear();
                        window.location.href = '/login/';
                    } else {
                        const errData = await response.json();
                        alert(`Erro da API: ${errData.error || 'Falha ao processar.'}`);
                    }
                } catch (error) {
                    console.error('Erro na geração do roadmap:', error);
                    alert('Erro de conexão com o servidor. Tente novamente mais tarde.');
                } finally {
                    btnGenerate.disabled = false;
                    loadingIndicator.style.display = 'none';
                }
            });
        });
    </script>
</body>

</html>
