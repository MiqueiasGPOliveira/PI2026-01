{% extends 'base.html' %}

{% block title %}Login - Mentor{% endblock %}

{% block extra_css %}
<style>
    *, *::before, *::after {
        box-sizing: border-box;
    }

    .auth-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        flex: 1;
        padding: 40px 20px;
        min-height: calc(100vh - 80px);
        width: 100%;
    }

    .container {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 40px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 400px;
    }

    h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #38bdf8; 
        font-size: 2rem;
        letter-spacing: -0.025em;
        margin-top: 0;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        color: #94a3b8;
    }

    .form-group input {
        width: 100%;
        padding: 12px 16px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid #334155;
        border-radius: 8px;
        color: #fff;
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    .form-group input:focus {
        outline: none;
        border-color: #38bdf8;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        background: rgba(15, 23, 42, 0.8);
    }

    .btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.39);
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    .btn:active {
        transform: translateY(0);
    }

    .error-message {
        color: #f87171;
        margin-top: 15px;
        text-align: center;
        font-size: 0.875rem;
        background-color: rgba(127, 29, 29, 0.2);
        border: 1px solid rgba(248, 113, 113, 0.2);
        padding: 12px;
        border-radius: 8px;
        display: none;
    }

    .footer-link {
        display: block;
        text-align: center;
        margin-top: 25px;
        font-size: 0.875rem;
        color: #94a3b8;
    }

    .footer-link a {
        color: #38bdf8;
        text-decoration: none;
        font-weight: 600;
    }

    .footer-link a:hover {
        text-decoration: underline;
    }

    ::placeholder {
        color: #475569;
    }

    /* --- AJUSTES EXCLUSIVOS PARA MOBILE (Telas de 360px a 480px) --- */
    @media (max-width: 480px) {
        .auth-wrapper {
            padding: 100px 15px 40px 15px; /* Evita que o topo do formulário suma sob o menu */
            align-items: flex-start; /* Melhor posicionamento em telas muito baixinhas */
            min-height: auto;
        }

        .container {
            padding: 24px 20px;
            border-radius: 12px;
        }

        h2 {
            font-size: 1.65rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group input {
            padding: 11px 14px;
            font-size: 0.95rem;
        }

        .btn {
            padding: 11px;
            font-size: 0.95rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="container">
        <h2>Entrar</h2>
        <form id="loginForm">
            {% csrf_token %}

            <div class="form-group">
                <label for="usuario">Usuário ou E-mail</label>
                <input type="text" id="usuario" name="usuario" required placeholder="Seu apelido ou e-mail">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required placeholder="sua senha secreta">
            </div>

            <button type="submit" class="btn">Acessar Plataforma</button>
            <div id="errorMessage" class="error-message"></div>
        </form>

        <div class="footer-link">
            Novo por aqui? <a href="/cadastro/">Crie sua conta</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('loginForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const form = event.target;
        const errorMessageDiv = document.getElementById('errorMessage');
        errorMessageDiv.style.display = 'none';
        errorMessageDiv.innerHTML = '';

        const csrfToken = form.querySelector('[name=csrfmiddlewaretoken]').value;

        const data = {
            usuario: form.usuario.value,
            password: form.password.value
        };

        try {
            const response = await fetch("/api/auth/login", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify(data)
            });

            if (response.status === 200) {
                const responseData = await response.json();
                localStorage.setItem('access_token', responseData.access);
                localStorage.setItem('refresh_token', responseData.refresh);
                window.location.href = '/';
            } else {
                errorMessageDiv.innerHTML = "<strong>Acesso negado:</strong> Credenciais inválidas.";
                errorMessageDiv.style.display = 'block';
            }
        } catch (error) {
            errorMessageDiv.innerHTML = "Falha na conexão com a IA Mentor.";
            errorMessageDiv.style.display = 'block';
        }
    });
</script>
{% endblock %}
